name: Update site

on:
  schedule:
    - cron: "0 11 * * 0"   # Sunday 6 AM Central: after Saturday's games
    - cron: "0 11 * * 3"   # Wednesday 6 AM Central: schedule/time changes
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore cached past seasons
        uses: actions/cache@v4
        with:
          path: cache
          key: cfbd-cache-${{ github.run_id }}
          restore-keys: cfbd-cache-

      - name: Fetch data and build pages
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
